services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_NAME: ${APP_NAME:-Heritage Memory}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      COGNEE_STORAGE_PATH: /app/data/cognee
      MEMORY_STORE_PATH: /app/data/memories.json
      USE_COGNEE: ${USE_COGNEE:-true}
    volumes:
      - heritage_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  heritage_data:
